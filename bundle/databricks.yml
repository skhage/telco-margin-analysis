# Lakelink Fiber - Margin Truth (telco-margin-analysis)
# Declarative Automation Bundle skeleton (P0-REPO-DAB-SKELETON).
#
# HARD RULE: this bundle deploys into EXISTING Unity Catalog schemas only.
#   - tables, UC functions, volume margin_documents -> ${var.catalog}.${var.schema} (prefix margin_)
#   - metric views                                   -> ${var.catalog}.${var.metrics_schema} (prefix margin_)
# Never add `schemas:` (or `catalogs:`) resources to this bundle. @qa audits this.
#
# Resource files are added under resources/ using <name>.<resource_type>.yml:
#   margin_pipeline.pipeline.yml     ONE SDP pipeline (bronze/silver/gold -> margin_ledger)
#   margin_functions.job.yml         job that (re)creates margin_ UC functions
#   margin_scorecard.dashboard.yml   ONE AI/BI dashboard (CFO scorecard + $1B Wall)
#   margin_app.app.yml               ONE Databricks App (approval queue + margin explorer)
#   margin_stall_monitor.job.yml     hourly swarm stall monitor over the Lakebase task board
#   margin_metric_views.job.yml      deploys src/metric_views/*.yaml into ${var.metrics_schema} (dry run default)
#   margin_synth_generator.job.yml   rebuilds margin_ synthetic tables + fast-path ledger (dry run default)
#   margin_genie (Genie agent)       space 01f1df115a08164aab3ae5f6faac807c; config in ../genie (see README.md)
# Secrets and tokens are NEVER committed; use secret scopes or app resources.

bundle:
  name: telco_margin_analysis

include:
  - resources/*.yml

# Sources outside bundle/ that resources reference (app source, UC function SQL).
sync:
  paths:
    - .
    - ../apps/margin-truth
    - ../agents
    - ../tests
    - ../src
    - ../data
  # DEVOPS-EXCLUDE-PROJECTPLAN (QA-F-BRAND-PROJECTPLAN): resources/projectplan.md is a
  # CEO-supplied research reference that names a real company. It must NEVER ship in the
  # bundle or the app source. ../resources is intentionally not in sync.paths; this
  # exclude is a second guard in case a broader path (e.g. ..) is added later.
  # (A "**/projectplan.md" glob fails validate --strict because it matches nothing.)
  exclude:
    - "../resources/projectplan.md"

variables:
  catalog:
    description: Existing Unity Catalog catalog for all project assets.
    default: cdm_tmforum
  schema:
    description: Existing schema for margin_ tables, UC functions, and the margin_documents volume.
    default: revenue_assurance
  metrics_schema:
    description: Existing schema for margin_ metric views.
    default: _metrics
  project_tag:
    description: Value for the telco_project tag applied to every project asset.
    default: margin_analysis
  warehouse_id:
    description: SQL warehouse for the app, UC function job, and dashboard.
    lookup:
      warehouse: telco_cdm_model

presets:
  tags:
    telco_project: ${var.project_tag}

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: ~/.bundle/${bundle.name}/${bundle.target}
