# Lakelink Fiber - Margin Truth: the ONE AI/BI dashboard (reserved name 'Lakelink Fiber Margin Truth').
# DEVOPS-BUNDLE-LIVE-ASSETS (DEC-022): THE ONE dashboard is workspace object 3728290263738094
# (uuid 01f1df1950c51bd68e87ace31632c2bf). P3-DASHBOARD renamed it, so the file is now
# src/dashboards/Lakelink Fiber Margin Truth.lvdash.json (same object id). P3-DASHBOARD (@data-analyst) imports the skeleton
# (src/dashboards/margin_truth_skeleton.json) into that object and embeds Margin Genie.
# ONE-DASHBOARD CAP: before any deploy, BIND this key to the live dashboard instead of creating a
# second one: databricks bundle deployment bind margin_scorecard 01f1df1950c51bd68e87ace31632c2bf
# (see ../DEPLOY_RUNBOOK.md).
# DEVOPS-JOBS-ONLY-FALLBACK: declared under targets.dev only, so the jobs_only target never
# creates, binds, or [dev]-renames the live dashboard.
targets:
  dev:
    resources:
      dashboards:
        margin_scorecard:
          display_name: Lakelink Fiber Margin Truth
          file_path: "../../src/dashboards/Lakelink Fiber Margin Truth.lvdash.json"
          warehouse_id: ${var.warehouse_id}
          dataset_catalog: ${var.catalog}
          dataset_schema: ${var.metrics_schema}

