# Lakelink Fiber - Margin Truth: the ONE AI/BI dashboard (reserved name 'Lakelink Fiber Margin Truth').
# DEVOPS-BUNDLE-LIVE-ASSETS (DEC-022): THE ONE dashboard is workspace object 3728290263738094 at
# src/dashboards/margin_truth_skeleton.lvdash.json. P3-DASHBOARD (@data-analyst) imports the skeleton
# (src/dashboards/margin_truth_skeleton.json) into that object and embeds Margin Genie.
# ONE-DASHBOARD CAP: before any deploy, BIND this key to the live dashboard instead of creating a
# second one: databricks bundle deployment bind margin_scorecard <dashboard uuid> (P6-DAB-DEPLOY).
resources:
  dashboards:
    margin_scorecard:
      display_name: Lakelink Fiber Margin Truth
      file_path: ../../src/dashboards/margin_truth_skeleton.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.metrics_schema}

