# Lakelink Fiber - Margin Truth: job that (re)creates the margin_ UC functions in the EXISTING
# schema ${var.catalog}.${var.schema}. LIVE (DEVOPS-BUNDLE-LIVE-ASSETS, 2026-11-13): both functions
# exist in cdm_tmforum.revenue_assurance (margin_score_onnet_move 2026-11-12, margin_compare_rates
# 2026-11-13). The SQL files hard-code cdm_tmforum.revenue_assurance (= the bundle defaults).
# CREATE OR REPLACE FUNCTION only; never creates schemas.
resources:
  jobs:
    margin_functions_job:
      name: lakelink-margin-functions
      description: Creates or replaces Lakelink Fiber margin_ UC functions (telco_project=margin_analysis)
      max_concurrent_runs: 1
      tasks:
        - task_key: margin_score_onnet_move
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../../agents/margin_score_onnet_move.sql
              source: WORKSPACE
        - task_key: margin_compare_rates
          depends_on:
            - task_key: margin_score_onnet_move
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../../agents/margin_compare_rates.sql
              source: WORKSPACE
